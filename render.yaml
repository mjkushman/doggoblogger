services:
  - type: web
    runtime: static
    name: doggoblog
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback: serve index.html for any path so refreshing a deep link works
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_URL
        sync: false
      - key: VITE_AUTOBLOGGER_API_KEY
        sync: false
